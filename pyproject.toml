[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "geometric-neuron-v24"
version = "0.1.0"
description = "Addressed multiscale scalar observation laboratory"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Antti Luode" }]
dependencies = [
  "numpy>=2.0",
  "scipy>=1.12",
  "matplotlib>=3.8",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
