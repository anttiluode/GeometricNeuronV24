name: gates

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e .
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Gate 0 - lens algebra and random-image null
        run: python experiments/gate0_lens_rank.py --no-plots
      - name: Gate 1 - structured-world address policy
        run: python experiments/gate1_structured_lens.py --no-plots
      - name: Gate 2 - controlled hidden-law identification
        run: python experiments/gate2_rule_sherlock.py --no-plots
      - name: Gate 2 robustness audit
        run: python experiments/gate2_robustness.py
