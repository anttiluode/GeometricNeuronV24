name: gates

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e .
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Gate 0 - lens algebra and random-image null
        run: python experiments/gate0_lens_rank.py --no-plots
      - name: Gate 1 - structured-world address policy
        run: python experiments/gate1_structured_lens.py --no-plots
      - name: Gate 2 robustness audit
        run: python experiments/gate2_robustness.py
      - name: Gate 3 - READ + WRITE
        run: python experiments/gate3_read_write.py
      - name: Gate 3 robustness audit
        run: python experiments/gate3_robustness.py
      - name: Gate 4 - real cell 1125 soma observability
        run: python experiments/gate4_cell1125_observability.py
      - name: Gate 4 robustness and noise boundary
        run: python experiments/gate4_robustness.py
      - name: Gate 5 - NMDA observability bridge
        run: python experiments/gate5_nmda_observability.py
      - name: Gate 6 - PerceptionLab persistent memory
        run: python experiments/gate6_perceptionlab_memory.py
      - name: Gate 6B - information-gain multiscale audit
        run: python experiments/gate6b_information_policy.py
      - name: Gate 6C - write timescale
        run: python experiments/gate6c_write_timescale.py
